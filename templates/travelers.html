<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Travel Assistant</title>
<style>
  :root {
    --ink: #14213D;
    --ink-soft: #3A4A6B;
    --paper: #FBF9F4;
    --card: #FFFFFF;
    --amber: #E8A33D;
    --amber-dark: #B87A1E;
    --line: #DDD6C7;
    --success: #2F7A52;
    --danger: #B23B3B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(20,33,61,0.08), 0 8px 24px rgba(20,33,61,0.06);
  }
  .header {
    background: var(--ink);
    color: var(--paper);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber);
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: #A9B4CC;
  }
  .chat {
    padding: 20px 20px 8px;
    max-height: 560px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.bot {
    background: #F0EDE3;
    color: var(--ink);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--ink);
    color: var(--paper);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .ticket {
    align-self: flex-start;
    width: 100%;
    max-width: 92%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .flight-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .flight-card:hover { border-color: var(--amber); transform: translateY(-1px); }
  .flight-card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--amber);
    border-radius: 10px 0 0 10px;
  }
  .flight-info .airline {
    font-weight: 600;
    font-size: 13.5px;
  }
  .flight-info .code {
    font-family: "Courier New", monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
    letter-spacing: 0.03em;
  }
  .flight-price {
    font-family: "Courier New", monospace;
    font-weight: 700;
    font-size: 15px;
    color: var(--amber-dark);
  }
  .quick-form, .step-form {
    background: #F7F4EC;
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    align-self: flex-start;
    width: 100%;
  }
  .step-form .form-title {
    grid-column: 1 / -1;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .quick-form input,
  .step-form input,
  .step-form select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
  }
  .quick-form input:focus,
  .step-form input:focus,
  .step-form select:focus {
    outline: none;
    border-color: var(--amber);
  }
  .full-row { grid-column: 1 / -1; }
  .field-label {
    grid-column: 1 / -1;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin: 2px 0 -4px;
  }
  .submit-btn {
    grid-column: 1 / -1;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 2px;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: #253256; }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  .field-error {
    grid-column: 1 / -1;
    color: var(--danger);
    font-size: 11.5px;
    margin-top: -4px;
  }

  /* --- Payment step --- */
  .card-brands {
    grid-column: 1 / -1;
    display: flex;
    gap: 6px;
    margin-bottom: 2px;
  }
  .card-brand {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    transition: all 0.15s;
  }
  .card-brand.active {
    border-color: var(--amber);
    color: var(--ink);
    background: #FDF3E2;
  }
  .card-visual {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, var(--ink) 0%, #253256 100%);
    color: var(--paper);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: "Courier New", monospace;
    margin-bottom: 4px;
    position: relative;
    overflow: hidden;
  }
  .card-visual .chip {
    width: 26px; height: 18px;
    background: linear-gradient(135deg, var(--amber), var(--amber-dark));
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .card-visual .num {
    font-size: 15px;
    letter-spacing: 0.12em;
    min-height: 18px;
  }
  .card-visual .meta {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 10px;
    color: #A9B4CC;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card-visual .meta span.name-val, .card-visual .meta span.exp-val {
    display: block;
    color: var(--paper);
    font-size: 12px;
    margin-top: 2px;
    text-transform: none;
  }
  .gpay-btn {
    grid-column: 1 / -1;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .gpay-btn:hover { border-color: var(--amber); }
  .or-divider {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--ink-soft);
    margin: 2px 0;
  }
  .or-divider::before, .or-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .secure-note {
    grid-column: 1 / -1;
    font-size: 10px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 2px;
  }

  .pnr-card {
    align-self: flex-start;
    width: 100%;
    max-width: 92%;
    background: var(--ink);
    color: var(--paper);
    border-radius: 12px;
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .pnr-card::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 68%;
    width: 0;
    border-left: 2px dashed rgba(251,249,244,0.25);
  }
  .pnr-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: #A9B4CC;
    text-transform: uppercase;
  }
  .pnr-code {
    font-family: "Courier New", monospace;
    font-size: 26px;
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 0.08em;
    margin: 4px 0 10px;
  }
  .pnr-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #C7CEE0;
    margin-top: 4px;
  }
  .composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px 20px;
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 14px;
    font-family: inherit;
  }
  .composer input:focus { outline: none; border-color: var(--amber); }
  .composer button {
    background: var(--amber);
    border: none;
    color: var(--ink);
    font-weight: 700;
    padding: 0 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
  }
  .error-msg { color: #B23B3B; background: #FBEAEA; }
  .spinner {
    align-self: flex-start;
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="dot"></div>
    <div>
      <h1>AI Travel Assistant</h1>
      <p>Live search &middot; test mode</p>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">
      Hi! Where would you like to go? Type it below, e.g.
      "I want to go from Lahore to Islamabad" — or use the form.
    </div>
    <div class="quick-form" id="searchForm">
      <input id="origin" placeholder="Origin (e.g. KHI)" maxlength="3" style="text-transform:uppercase">
      <input id="destination" placeholder="Destination (e.g. IST)" maxlength="3" style="text-transform:uppercase">
      <input id="date" type="date">
      <input id="passengers" type="number" min="1" value="1">
      <button class="submit-btn full-row" onclick="runSearch()">Search flights</button>
    </div>
  </div>

  <div class="composer">
    <input id="freeText" placeholder="e.g. I want to go from Lahore to Islamabad, 15 August" onkeydown="if(event.key==='Enter') sendFreeText()">
    <button onclick="sendFreeText()">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');

function addBotMessage(html) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

let conversationHistory = [];  // full chat record with Claude (Anthropic format)

// Safe fetch wrapper — never crashes even if the server returns HTML/an error page
// instead of JSON (this is what caused the earlier "Unexpected token '<'" error).
async function safeFetchJson(url, options) {
  const res = await fetch(url, options);
  const raw = await res.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    throw new Error(`Server returned an unexpected response (status ${res.status}). Check the backend logs.`);
  }
  if (!res.ok && !('success' in data)) {
    throw new Error(data.detail || `Request failed (status ${res.status})`);
  }
  return data;
}

async function sendFreeText() {
  const input = document.getElementById('freeText');
  const text = input.value.trim();
  if (!text) return;
  addUserMessage(text);
  input.value = '';

  const loading = addBotMessage('<span class="spinner">Thinking...</span>');

  try {
    const data = await safeFetchJson('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: conversationHistory })
    });
    loading.remove();

    if (!data.success) {
      addBotMessage(`<span class="error-msg">${escapeHtml(data.error)}</span>`);
      return;
    }

    conversationHistory = data.history;  // keep history for the next turn
    addBotMessage(data.reply);

    // If Claude called search_flights, offers will be included here
    if (data.offers && data.offers.length > 0) {
      renderFlightCards(data.offers);
    }
  } catch (err) {
    loading.remove();
    addBotMessage(`<span class="error-msg">Something went wrong: ${escapeHtml(err.message)}</span>`);
  }
}

function renderFlightCards(offers) {
  const ticketWrap = document.createElement('div');
  ticketWrap.className = 'ticket';
  offers.forEach(o => {
    const card = document.createElement('div');
    card.className = 'flight-card';
    card.innerHTML = `
      <div class="flight-info">
        <div class="airline">${escapeHtml(o.airline)}</div>
        <div class="code">offer: ${escapeHtml(o.offer_id.slice(0, 10))}...</div>
      </div>
      <div class="flight-price">${escapeHtml(o.price)} ${escapeHtml(o.currency)}</div>
    `;
    card.onclick = () => selectOffer(o, null, null);
    ticketWrap.appendChild(card);
  });
  chat.appendChild(ticketWrap);
  chat.scrollTop = chat.scrollHeight;
}

async function runSearch() {
  const origin = document.getElementById('origin').value.trim().toUpperCase();
  const destination = document.getElementById('destination').value.trim().toUpperCase();
  const date = document.getElementById('date').value;
  const passengers = parseInt(document.getElementById('passengers').value) || 1;

  if (!origin || !destination || !date) {
    addBotMessage('<span>Origin, destination, and date are all required.</span>');
    return;
  }

  addUserMessage(`${origin} → ${destination}, ${date}, ${passengers} passenger(s)`);
  const loading = addBotMessage('<span class="spinner">Searching flights...</span>');

  try {
    const data = await safeFetchJson('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ origin, destination, departure_date: date, passengers })
    });
    loading.remove();

    if (!data.success) {
      addBotMessage(`<span class="error-msg">Search failed: ${escapeHtml(data.error)}</span>`);
      return;
    }
    if (data.offers.length === 0) {
      addBotMessage('No flights found for this route in test data. Try a different route.');
      return;
    }

    addBotMessage(`Found ${data.offers.length} options, sorted by price:`);

    const ticketWrap = document.createElement('div');
    ticketWrap.className = 'ticket';
    data.offers.forEach(o => {
      const card = document.createElement('div');
      card.className = 'flight-card';
      card.innerHTML = `
        <div class="flight-info">
          <div class="airline">${escapeHtml(o.airline)}</div>
          <div class="code">${escapeHtml(origin)} → ${escapeHtml(destination)} · ${escapeHtml(date)}</div>
        </div>
        <div class="flight-price">${escapeHtml(o.price)} ${escapeHtml(o.currency)}</div>
      `;
      card.onclick = () => selectOffer(o, origin, destination, date);
      ticketWrap.appendChild(card);
    });
    chat.appendChild(ticketWrap);
    chat.scrollTop = chat.scrollHeight;
  } catch (err) {
    loading.remove();
    addBotMessage(`<span class="error-msg">Something went wrong: ${escapeHtml(err.message)}</span>`);
  }
}

/* =========================================================================
   Booking journey after an offer is picked:
     1) selectOffer      -> quick account signup (calls real /api/signup)
     2) showPassengerStep -> full passenger details (as required by /api/book)
     3) showPaymentStep   -> mock card entry (visual only, for the demo) or
                              a one-tap "Pay with G Pay" shortcut
     4) confirmBooking     -> calls the real /api/book endpoint (unchanged)
   ========================================================================= */

function selectOffer(offer) {
  addUserMessage(`Selected ${offer.airline} — ${offer.price} ${offer.currency}`);
  showSignupStep(offer);
}

function showSignupStep(offer) {
  addBotMessage('Great choice! First, let\'s create a quick account for your booking.');

  const form = document.createElement('div');
  form.className = 'step-form';
  form.innerHTML = `
    <div class="form-title">Create your account</div>
    <input id="s_email" type="email" class="full-row" placeholder="Email address">
    <input id="s_phone" placeholder="Phone (+92...)">
    <input id="s_password" type="password" placeholder="Password">
    <div class="field-error full-row" id="s_error" style="display:none;"></div>
    <button class="submit-btn full-row" id="s_submit">Create account &amp; continue</button>
  `;
  chat.appendChild(form);
  chat.scrollTop = chat.scrollHeight;

  form.querySelector('#s_submit').onclick = () => submitSignup(offer, form);
}

async function submitSignup(offer, form) {
  const email = form.querySelector('#s_email').value.trim();
  const phone = form.querySelector('#s_phone').value.trim();
  const password = form.querySelector('#s_password').value;
  const errorBox = form.querySelector('#s_error');
  errorBox.style.display = 'none';

  if (!email || !phone || !password) {
    errorBox.textContent = 'Please fill in email, phone, and password.';
    errorBox.style.display = 'block';
    return;
  }

  const btn = form.querySelector('#s_submit');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const data = await safeFetchJson('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, phone_number: phone, password })
    });

    if (!data.success) {
      errorBox.textContent = data.error || 'Could not create account.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create account & continue';
      return;
    }

    form.remove();
    addUserMessage(`Account: ${email}`);
    addBotMessage('Account created. Now let\'s get your traveler details.');
    showPassengerStep(offer, { email, phone });
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create account & continue';
  }
}

function showPassengerStep(offer, account) {
  const form = document.createElement('div');
  form.className = 'step-form';
  form.innerHTML = `
    <div class="form-title">Traveler details</div>
    <select id="p_title">
      <option value="mr">Mr</option>
      <option value="mrs">Mrs</option>
      <option value="ms">Ms</option>
    </select>
    <select id="p_gender">
      <option value="m">Male</option>
      <option value="f">Female</option>
    </select>
    <input id="p_given" placeholder="First name">
    <input id="p_family" placeholder="Last name">
    <input id="p_email" placeholder="Email" class="full-row" value="${escapeHtml(account?.email || '')}">
    <input id="p_phone" placeholder="+92..." value="${escapeHtml(account?.phone || '')}">
    <div class="field-label">Date of birth</div>
    <input id="p_dob" type="date" class="full-row">
    <div class="field-error full-row" id="p_error" style="display:none;"></div>
    <button class="submit-btn full-row" id="p_submit">Continue to payment</button>
  `;
  chat.appendChild(form);
  chat.scrollTop = chat.scrollHeight;

  form.querySelector('#p_submit').onclick = () => {
    const passenger = {
      title: form.querySelector('#p_title').value,
      gender: form.querySelector('#p_gender').value,
      given_name: form.querySelector('#p_given').value.trim(),
      family_name: form.querySelector('#p_family').value.trim(),
      email: form.querySelector('#p_email').value.trim(),
      phone_number: form.querySelector('#p_phone').value.trim(),
      born_on: form.querySelector('#p_dob').value,
    };
    const errorBox = form.querySelector('#p_error');
    if (!passenger.given_name || !passenger.family_name || !passenger.email ||
        !passenger.phone_number || !passenger.born_on) {
      errorBox.textContent = 'Please fill in all traveler details, including date of birth.';
      errorBox.style.display = 'block';
      return;
    }
    errorBox.style.display = 'none';
    form.remove();
    addUserMessage(`${passenger.given_name} ${passenger.family_name} · DOB ${passenger.born_on}`);
    showPaymentStep(offer, passenger);
  };
}

function formatCardNumber(raw) {
  const digits = raw.replace(/\D/g, '').slice(0, 16);
  return digits.replace(/(.{4})/g, '$1 ').trim();
}

function detectBrand(digits) {
  if (/^4/.test(digits)) return 'visa';
  if (/^5[1-5]/.test(digits)) return 'mastercard';
  return null;
}

function showPaymentStep(offer, passenger) {
  addBotMessage(`Last step — enter payment details to pay ${offer.price} ${offer.currency} (test mode, no real charge).`);

  const form = document.createElement('div');
  form.className = 'step-form';
  form.innerHTML = `
    <div class="form-title">Payment</div>

    <div class="card-visual">
      <div class="chip"></div>
      <div class="num" id="cv_number">•••• •••• •••• ••••</div>
      <div class="meta">
        <div>
          <span>Card holder</span>
          <span class="name-val" id="cv_name">YOUR NAME</span>
        </div>
        <div>
          <span>Expires</span>
          <span class="exp-val" id="cv_exp">MM/YY</span>
        </div>
      </div>
    </div>

    <div class="card-brands">
      <div class="card-brand" id="brand_visa">VISA</div>
      <div class="card-brand" id="brand_mc">MASTERCARD</div>
    </div>

    <input id="c_name" class="full-row" placeholder="Cardholder name">
    <input id="c_number" class="full-row" placeholder="Card number" inputmode="numeric" maxlength="19">
    <input id="c_exp" placeholder="MM/YY" maxlength="5">
    <input id="c_cvc" placeholder="CVC" maxlength="4" inputmode="numeric">
    <div class="field-error full-row" id="c_error" style="display:none;"></div>
    <button class="submit-btn full-row" id="c_submit">Pay ${escapeHtml(offer.price)} ${escapeHtml(offer.currency)}</button>

    <div class="or-divider">OR</div>
    <button class="gpay-btn" id="gpay_btn">Pay with G Pay</button>

    <div class="secure-note">Test mode — no real card is charged. Payment is settled from the agency's Duffel test balance.</div>
  `;
  chat.appendChild(form);
  chat.scrollTop = chat.scrollHeight;

  const numberInput = form.querySelector('#c_number');
  const nameInput = form.querySelector('#c_name');
  const expInput = form.querySelector('#c_exp');
  const cvNumber = form.querySelector('#cv_number');
  const cvName = form.querySelector('#cv_name');
  const cvExp = form.querySelector('#cv_exp');
  const brandVisa = form.querySelector('#brand_visa');
  const brandMc = form.querySelector('#brand_mc');

  numberInput.addEventListener('input', () => {
    const formatted = formatCardNumber(numberInput.value);
    numberInput.value = formatted;
    const digits = formatted.replace(/\s/g, '');
    cvNumber.textContent = formatted ? formatted.padEnd(19, '•') : '•••• •••• •••• ••••';
    const brand = detectBrand(digits);
    brandVisa.classList.toggle('active', brand === 'visa');
    brandMc.classList.toggle('active', brand === 'mastercard');
  });

  nameInput.addEventListener('input', () => {
    cvName.textContent = nameInput.value.trim().toUpperCase() || 'YOUR NAME';
  });

  expInput.addEventListener('input', () => {
    let v = expInput.value.replace(/\D/g, '').slice(0, 4);
    if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2);
    expInput.value = v;
    cvExp.textContent = v || 'MM/YY';
  });

  form.querySelector('#c_submit').onclick = () => {
    const errorBox = form.querySelector('#c_error');
    const digits = numberInput.value.replace(/\s/g, '');
    const expOk = /^(0[1-9]|1[0-2])\/\d{2}$/.test(expInput.value);
    const cvc = form.querySelector('#c_cvc').value;

    if (digits.length !== 16 || !nameInput.value.trim() || !expOk || cvc.length < 3) {
      errorBox.textContent = 'Please check the card number (16 digits), expiry (MM/YY), and CVC.';
      errorBox.style.display = 'block';
      return;
    }
    errorBox.style.display = 'none';
    form.remove();
    addUserMessage(`Paying by card •••• ${digits.slice(-4)}`);
    confirmBooking(offer, passenger, null);
  };

  form.querySelector('#gpay_btn').onclick = () => {
    form.remove();
    addUserMessage('Paying with G Pay');
    confirmBooking(offer, passenger, null);
  };
}

async function confirmBooking(offer, passenger, btn) {
  const loading = addBotMessage('<span class="spinner">Confirming your booking...</span>');

  try {
    const data = await safeFetchJson('/api/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ offer_id: offer.offer_id, passenger })
    });
    loading.remove();

    if (!data.success) {
      addBotMessage(`<span class="error-msg">Booking failed: ${escapeHtml(data.error)}</span>`);
      return;
    }

    const pnr = document.createElement('div');
    pnr.className = 'pnr-card';
    pnr.innerHTML = `
      <div class="pnr-label">Booking confirmed</div>
      <div class="pnr-code">${escapeHtml(data.pnr)}</div>
      <div class="pnr-row"><span>Order ID</span><span>${escapeHtml(data.order_id)}</span></div>
      <div class="pnr-row"><span>Total paid</span><span>${escapeHtml(data.total_paid)}</span></div>
    `;
    chat.appendChild(pnr);
    chat.scrollTop = chat.scrollHeight;
  } catch (err) {
    loading.remove();
    addBotMessage(`<span class="error-msg">Something went wrong: ${escapeHtml(err.message)}</span>`);
  }
}
</script>
